name: Build and publish Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      APP_NAME: school-test
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build hidden single-file Windows executable
        run: pyinstaller --onefile --windowed --name "${{ env.APP_NAME }}" --add-data "${{ github.workspace }}\templates;templates" --add-data "${{ github.workspace }}\backups;backups" --distpath dist --workpath build --specpath build app.py

      - name: Verify executable
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\${{ env.APP_NAME }}.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Create GitHub Release and attach executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated Windows build for ${{ github.ref_name }}.

            The executable is a single-file PyInstaller build suitable for OTA installation.
            It runs without a console window and contains the Flask templates and backup assets.
          files: |
            dist/${{ env.APP_NAME }}.exe
          overwrite_files: true
